name: Build CloudFormation Template
description: Build and validate CloudFormation templates used as Nested Stacks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - feature/**
      - bug/**
    paths:
      - 'templates/**'
      - 'parameters/**'
      - '.github/workflows/ci.yaml'

env:
  DEPLOY_ENV: ci
  # Allowed environment values: ci, devl, test, prod
  # To deploy to a different environment, update DEPLOY_ENV above

jobs:
  get-config:
    name: Get Environment Configuration
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - id: config
        run: |
          echo "aws-region=${{ env.AWS_REGION }}" >> $GITHUB_OUTPUT
          echo "aws-account-id=${{ env.AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
          echo "oidc-role-name=${{ env.OIDC_ROLE_NAME }}" >> $GITHUB_OUTPUT


