name: Deploy CloudFormation Stack
description: Deploy CloudFormation S3 Bucket Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - bug/**
    paths:
      - 'templates/**'
      - .github/workflows/ci.yaml


permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  deploy-s3-bucket-stack:
    environment: devl
    runs-on: ubuntu-latest
    steps:
      - name: Extract AWS values from environment ARNs
        id: extract_values
        run: |
          ROLE_NAME=$(echo "${{ env.AWS_ROLE_ARN }}" | cut -d'/' -f2)
          ACCOUNT_ID=$(echo "${{ env.AWS_ROLE_ARN }}" | cut -d':' -f5)
          BUCKET_NAME=$(echo "${{ env.TF_STATE_BUCKET_ARN }}" | cut -d':' -f6)
          echo "role-name=${ROLE_NAME}" >> $GITHUB_OUTPUT
          echo "account-id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "bucket-name=${BUCKET_NAME}" >> $GITHUB_OUTPUT

      - name: Call CloudFormation deploy workflow
        uses: subhamay-bhattacharyya-gha/cloudformation-deploy-wf/.github/workflows/cfn-deploy.yaml@v1.1.0
        with:
          environment: devl
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ steps.extract_values.outputs.account-id }}
          oidc-role-name: ${{ steps.extract_values.outputs.role-name }}
          cfn-templates-s3-bucket: ${{ steps.extract_values.outputs.bucket-name }}
          stack-name: s3-bucket-stack
          template-file: templates/s3-bucket.yaml
          parameters-file: templates/parameters.json