name: Deploy CloudFormation Stack
description: Deploy CloudFormation S3 Bucket Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - bug/**
    paths:
      - 'templates/**'
      - .github/workflows/ci.yaml

# env:
#   ENVIRONMENT: devl
#   OIDC_ROLE_NAME: ${{ vars.OIDC_ROLE_NAME  }}
#   AWS_REGION: ${{ vars.AWS_REGION }}
#   AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
#   CFN_TEMPLATES_S3_BUCKET: ${{ vars.CFN_TEMPLATES_S3_BUCKET }}
#   S3_BUCKET_STACK_NAME: s3-bucket-stack
#   S3_BUCKET_POLICY_STACK_NAME: s3-bucket-policy-stack

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  get-config:
    name: Get Env Config
    runs-on: ubuntu-latest
    environment: devl
    steps:
      - id: config
        run: |
          # Write configuration summary to GitHub step summary
          {
            echo "## Environment Configuration"
            echo ""
            echo "| Variable | Value |"
            echo "|----------|-------|"
            echo "| Environment | ${{ env.ENVIRONMENT }} |"
            echo "| AWS Region | ${{ env.AWS_REGION }} |"
            echo "| AWS Account ID | ${{ env.AWS_ACCOUNT_ID }} |"
            echo "| OIDC Role Name | ${{ env.OIDC_ROLE_NAME }} |"
            echo "| CFN Templates S3 Bucket | ${{ env.CFN_TEMPLATES_S3_BUCKET }} |"
            echo "| S3 Bucket Stack Name | ${{ env.S3_BUCKET_STACK_NAME }} |"
            echo "| S3 Bucket Policy Stack Name | ${{ env.S3_BUCKET_POLICY_STACK_NAME }} |"
          } >> "$GITHUB_STEP_SUMMARY"

