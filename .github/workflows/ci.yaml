name: Deploy CloudFormation Stack
description: Deploy CloudFormation S3 Bucket Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - bug/**
    paths:
      - 'templates/**'
      - .github/workflows/ci.yaml


permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  setup-environment:
    name: Setup Environment Variables
    runs-on: ubuntu-latest
    environment: devl
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      aws-region: ${{ steps.set-env.outputs.aws-region }}
      aws-account-id: ${{ steps.set-env.outputs.aws-account-id }}
      oidc-role-name: ${{ steps.set-env.outputs.oidc-role-name }}
      s3-bucket: ${{ steps.set-env.outputs.s3-bucket }}
    steps:
      - name: Read environment-specific variables
        id: set-env
        run: |
          echo "environment=devl" >> $GITHUB_OUTPUT
          echo "aws-region=${{ env.AWS_REGION }}" >> $GITHUB_OUTPUT
          echo "aws-account-id=${{ env.AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
          echo "oidc-role-name=${{ env.AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
          echo "s3-bucket=${{ env.TF_STATE_BUCKET_ARN }}" >> $GITHUB_OUTPUT

          echo "## Environment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | devl |" >> $GITHUB_STEP_SUMMARY
          echo "| AWS Region | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AWS Account ID | ${{ env.AWS_ACCOUNT_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OIDC Role ARN | ${{ env.AWS_ROLE_ARN }} |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket ARN | ${{ env.TF_STATE_BUCKET_ARN }} |" >> $GITHUB_STEP_SUMMARY

  deploy-s3-bucket-stack:
    name: Deploy S3 Bucket Stack
    needs: setup-environment
    uses: subhamay-bhattacharyya-gha/cloudformation-deploy-wf/.github/workflows/cfn-deploy.yaml@v1.1.0
    with:
      environment: ${{ needs.setup-environment.outputs.environment }}
      concurrency-group: ${{ github.workflow }}-${{ needs.setup-environment.outputs.environment }}
      aws-region: ${{ needs.setup-environment.outputs.aws-region }}
      aws-account-id: ${{ needs.setup-environment.outputs.aws-account-id }}
      oidc-role-name: ${{ needs.setup-environment.outputs.oidc-role-name }}
      cfn-templates-s3-bucket: ${{ needs.setup-environment.outputs.s3-bucket }}
      stack-name: s3-bucket-stack
      parameters-file: templates/parameters.json
      template-file: templates/s3-bucket.yaml