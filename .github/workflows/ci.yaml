name: Deploy CloudFormation Stack
description: Deploy CloudFormation S3 Bucket Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - bug/**
    paths:
      - 'templates/**'
      - .github/workflows/ci.yaml

# env:
#   ENVIRONMENT: devl
#   OIDC_ROLE_NAME: ${{ vars.OIDC_ROLE_NAME  }}
#   AWS_REGION: ${{ vars.AWS_REGION }}
#   AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
#   CFN_TEMPLATES_S3_BUCKET: ${{ vars.CFN_TEMPLATES_S3_BUCKET }}
#   S3_BUCKET_STACK_NAME: s3-bucket-stack
#   S3_BUCKET_POLICY_STACK_NAME: s3-bucket-policy-stack

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  get-config:
    name: Get Env Config
    runs-on: ubuntu-latest
    environment: devl
    env:
      AWS_ENVIRONMENT: ${{ vars.AWS_ENVIRONMENT }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_KMS_KEY_ALIAS: ${{ vars.S3_KMS_KEY_ALIAS }}
      TF_STATE_BUCKET_ARN: ${{ vars.TF_STATE_BUCKET_ARN }}
    steps:
      - id: config
        run: |
          # Write configuration summary to GitHub step summary
          {
            echo "## Environment Configuration"
            echo ""
            echo "| Variable | Value |"
            echo "|----------|-------|"
            echo "| AWS Environment | ${{ env.AWS_ENVIRONMENT }} |"
            echo "| AWS Region | ${{ env.AWS_REGION }} |"
            echo "| AWS Role ARN | ${{ env.AWS_ROLE_ARN }} |"
            echo "| S3 KMS Key Alias | ${{ env.S3_KMS_KEY_ALIAS }} |"
            echo "| TF State Bucket ARN | ${{ env.TF_STATE_BUCKET_ARN }} |"
          } >> "$GITHUB_STEP_SUMMARY"

